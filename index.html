<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08081A">
<title>BIOAuditoria — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --or:#FF6B00;--or2:#FF8C33;--pu:#7B2FBE;--pu2:#A855F7;
  --bg:#08081A;--s1:#0F0F24;--s2:#161630;--s3:#1D1D3D;
  --t1:#F4F4FF;--t2:#9090B8;--t3:#505080;
  --bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.13);
  --r:16px;--r2:13px;
}
html,body{min-height:100%;background:var(--bg);color:var(--t1);font-family:'Plus Jakarta Sans',sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow-y:auto}

/* ── BACKGROUND ── */
.bg-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
.o1{width:600px;height:600px;background:radial-gradient(circle,rgba(255,107,0,0.22) 0%,transparent 70%);top:-200px;right:-150px;animation:float1 12s ease-in-out infinite}
.o2{width:500px;height:500px;background:radial-gradient(circle,rgba(123,47,190,0.18) 0%,transparent 70%);bottom:-150px;left:-150px;animation:float2 14s ease-in-out infinite}
.o3{width:300px;height:300px;background:radial-gradient(circle,rgba(168,85,247,0.1) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:float3 10s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,30px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-25px)}}
@keyframes float3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.012) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}

/* ── LAYOUT ── */
.wrap{position:relative;z-index:1;width:100%;max-width:400px}

/* ── LOGO ── */
.logo-area{text-align:center;margin-bottom:32px}
.logo-ico{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--or),var(--pu));display:inline-flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:14px;box-shadow:0 0 60px rgba(255,107,0,0.25),0 0 120px rgba(123,47,190,0.15);position:relative}
.logo-ico::after{content:'';position:absolute;inset:-1px;border-radius:21px;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);pointer-events:none}
.logo-nm{font-size:32px;font-weight:900;letter-spacing:-0.5px;line-height:1}
.logo-nm span{background:linear-gradient(90deg,var(--or2),var(--pu2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-tag{font-size:11px;color:var(--t3);margin-top:6px;letter-spacing:0.06em;text-transform:uppercase}

/* ── CARD ── */
.card{background:rgba(15,15,36,0.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--bd2);border-radius:24px;padding:28px 26px;box-shadow:0 40px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.04) inset}

/* ── ROLE SELECTOR ── */
.role-label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px}
.role-pills{display:flex;gap:8px;background:rgba(255,255,255,0.04);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:22px}
.rpill{flex:1;padding:9px 8px;border-radius:9px;cursor:pointer;text-align:center;transition:all 0.2s;border:1.5px solid transparent}
.rpill .rp-ico{font-size:18px;display:block;margin-bottom:3px;transition:transform 0.2s}
.rpill .rp-nm{font-size:11px;font-weight:700;color:var(--t3);transition:color 0.2s;line-height:1.2}
.rpill.on{background:linear-gradient(135deg,rgba(255,107,0,0.15),rgba(123,47,190,0.12));border-color:rgba(255,107,0,0.4);box-shadow:0 4px 16px rgba(255,107,0,0.12)}
.rpill.on .rp-nm{color:var(--or2)}
.rpill.on .rp-ico{transform:scale(1.12)}

/* ── FORM ── */
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em}
.fi{width:100%;padding:13px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--bd2);border-radius:11px;color:var(--t1);font-size:14px;font-family:inherit;outline:none;transition:all 0.2s;-webkit-appearance:none}
.fi:focus{border-color:var(--or);background:rgba(255,107,0,0.04);box-shadow:0 0 0 3px rgba(255,107,0,0.12)}
.fi::placeholder{color:var(--t3)}

/* ── ERROR ── */
.err{background:rgba(230,57,70,0.1);border:1px solid rgba(230,57,70,0.3);border-radius:10px;padding:10px 14px;font-size:13px;color:#ff8b95;display:none;margin-bottom:14px;text-align:center;line-height:1.5}

/* ── BUTTON ── */
.btn-login{width:100%;padding:15px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--or),var(--pu));color:#fff;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;transition:all 0.2s;letter-spacing:0.02em;position:relative;overflow:hidden}
.btn-login::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.12),transparent);pointer-events:none}
.btn-login:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,107,0,0.3)}
.btn-login:active{transform:scale(0.98);filter:brightness(0.96)}

/* ── DIVIDER ── */
.or-div{display:flex;align-items:center;gap:10px;margin:16px 0 14px}
.or-div::before,.or-div::after{content:'';flex:1;height:1px;background:var(--bd)}
.or-div span{font-size:11px;color:var(--t3);white-space:nowrap;font-weight:600}

/* ── REGISTER LINK ── */
.reg-link{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid var(--bd2);border-radius:12px;background:rgba(255,255,255,0.03);cursor:pointer;transition:all 0.18s;text-decoration:none;color:var(--t2);font-size:13px;font-weight:600}
.reg-link:hover{border-color:rgba(168,85,247,0.4);background:rgba(168,85,247,0.07);color:var(--pu2)}
.reg-link i{font-size:15px;color:var(--pu2)}

/* ── FOOTER ── */
.footer{text-align:center;margin-top:22px}
.footer-brand{font-size:11px;color:var(--t3);margin-bottom:8px}
.footer-brand strong{color:var(--or2)}
.norms{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.norm{background:rgba(123,47,190,0.1);border:1px solid rgba(123,47,190,0.25);border-radius:5px;padding:3px 8px;font-size:9px;color:var(--pu2);font-weight:600;letter-spacing:0.03em}
</style>
</head>
<body>
<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>
<div class="bg-orb o3"></div>
<div class="grid"></div>

<div class="wrap">
  <div class="logo-area">
    <div class="logo-ico">🏥</div>
    <div class="logo-nm">BIO<span>Auditoria</span></div>
    <div class="logo-tag">Gestión documental · Habilitación en salud · Colombia</div>
  </div>

  <div class="card">
    <div id="setup-msg"></div>

    <div class="role-label">Perfil de acceso</div>
    <div class="role-pills">
      <div class="rpill on" id="r-admin" onclick="setRole('admin')">
        <span class="rp-ico">⚙️</span>
        <span class="rp-nm">Admin</span>
      </div>
      <div class="rpill" id="r-cliente" onclick="setRole('cliente')">
        <span class="rp-ico">👩‍⚕️</span>
        <span class="rp-nm">Prestador</span>
      </div>
    </div>

    <div class="err" id="err"></div>

    <div class="fg">
      <label class="fl">Usuario</label>
      <input class="fi" type="text" id="user" placeholder="Tu nombre de usuario" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <div class="fg">
      <label class="fl">Contraseña</label>
      <div style="position:relative">
        <input class="fi" type="password" id="pass" placeholder="••••••••" autocomplete="off" style="padding-right:46px">
        <button type="button" onclick="togglePass()" id="pass-eye" style="position:absolute;right:0;top:0;bottom:0;width:46px;background:none;border:none;cursor:pointer;color:#9090B8;font-size:16px;display:flex;align-items:center;justify-content:center" title="Mostrar contraseña"><i class="fas fa-eye" id="eye-icon"></i></button>
      </div>
    </div>

    <button class="btn-login" onclick="doLogin()">Ingresar &nbsp;→</button>

    <div class="or-div"><span>¿Primera vez?</span></div>

    <a class="reg-link" href="registro/index.html">
      <i class="fas fa-user-plus"></i>
      Crear cuenta — Registrarme como prestador
    </a>
  </div>

  <div class="footer">
    <div class="footer-brand">Powered by <strong>BIOMarketing</strong> · ventasbio.com</div>
    <div class="norms">
      <span class="norm">📋 Res. 3100/2019</span>
      <span class="norm">♻️ Res. 1164/2002</span>
      <span class="norm">📁 Res. 1995/1999</span>
      <span class="norm">🛡️ Ley 1581/2012</span>
    </div>
  </div>
</div>

<script>
const USERS = {
  'admin':     {pass:'Bio@Admin2025!', role:'admin',    to:'admin/index.html'},
  'dra.vesga': {pass:'Vesga@2025',     role:'cliente',  to:'cliente/index.html'},
};
let rol = 'admin';

function setRole(r){
  rol = r;
  document.querySelectorAll('.rpill').forEach(b => b.classList.remove('on'));
  document.getElementById('r-' + r).classList.add('on');
}

function getUser(u){
  if(USERS[u]) return USERS[u];
  try {
    const db = JSON.parse(localStorage.getItem('bio_users_db') || '{}');
    return db[u] || null;
  } catch(e){ return null; }
}

function doLogin(){
  const u = document.getElementById('user').value.trim().toLowerCase();
  const p = document.getElementById('pass').value;
  const e = document.getElementById('err');
  const found = getUser(u);
  if(found && found.pass === p && found.role === rol){
    e.style.display = 'none';
    sessionStorage.setItem('bio_user', u);
    sessionStorage.setItem('bio_role', rol);
    window.location.href = found.to;
  } else {
    if(found && found.pass === p && found.role !== rol){
      e.textContent = 'Perfil incorrecto — selecciona "' + (found.role === 'admin' ? 'Admin' : 'Prestador') + '" arriba.';
    } else if(found && found.pass !== p){
      e.textContent = 'Contraseña incorrecta. Intenta de nuevo.';
    } else {
      e.textContent = 'Usuario no encontrado. Verifica tu usuario o selecciona el perfil correcto.';
    }
    e.style.display = 'block';
    document.getElementById('pass').value = '';
  }
}

function togglePass(){
  var inp = document.getElementById('pass');
  var icon = document.getElementById('eye-icon');
  if(inp.type === 'password'){ inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
}

document.addEventListener('keypress', e => { if(e.key === 'Enter') doLogin(); });

// ── SETUP LINK ──────────────────────────────────────────────────────────────
(function(){
  var params = new URLSearchParams(window.location.search);
  var setup = params.get('setup');
  if(!setup) return;
  try {
    var data = JSON.parse(atob(setup));
    if(!data.u || !data.p) return;
    var db = JSON.parse(localStorage.getItem('bio_users_db') || '{}');
    db[data.u] = { pass: data.p, role: 'cliente', to: 'cliente/index.html' };
    localStorage.setItem('bio_users_db', JSON.stringify(db));
    if(data.cli) localStorage.setItem('bio_cli_' + data.u, JSON.stringify(data.cli));
    window.history.replaceState({}, '', window.location.pathname);
    var msg = document.getElementById('setup-msg');
    msg.innerHTML = '<div style="background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:10px;padding:11px 14px;font-size:13px;color:#22C55E;font-weight:700;margin-bottom:16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px"><i class="fas fa-check-circle"></i> Acceso configurado — ya puedes ingresar</div>';
    var uInp = document.getElementById('user');
    if(uInp) uInp.value = data.u;
    setRole('cliente');
  } catch(ex){
    console.warn('Setup link error:', ex);
  }
})();

// Auto-redirect if already logged in
const r = sessionStorage.getItem('bio_role');
if(r === 'admin') window.location.replace('admin/index.html');
else if(r === 'cliente') window.location.replace('cliente/index.html');
</script>
</body>
</html>
